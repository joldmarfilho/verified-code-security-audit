name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install ".[dev]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate synthetic reports
        run: |
          vcsa validate examples/synthetic/audit-report.en.json
          vcsa validate examples/synthetic/audit-report.pt-BR.json

      - name: Render synthetic reports
        run: |
          vcsa render examples/synthetic/audit-report.en.json --locale en --output tmp/ci-output
          vcsa render examples/synthetic/audit-report.pt-BR.json --locale pt-BR --output tmp/ci-output

      - name: Upload rendered reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-security-audit-reports
          path: |
            tmp/ci-output/security-audit-report.en.pdf
            tmp/ci-output/github-issues.en.md
            tmp/ci-output/security-audit-report.pt-BR.pdf
            tmp/ci-output/github-issues.pt-BR.md
          if-no-files-found: error
